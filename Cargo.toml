[workspace]

[package]
name = "dekopon-asset-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "List, remove, send, cat and attach conversation assets through Dekopon handles"
repository = "https://github.com/dekopon-agents/dekopon-provider-asset"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dekopon-provider-sdk = { version = "=0.18.0", features = ["clap"] }
mime = "=0.3.17"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# `export_provider_with_cli!` needs this crate's own bindings for the `provider-cli` world. 0.62.0 is
# the version the SDK generates its bindings with; two wit-bindgen runtimes in one component would
# define `cabi_realloc` twice.
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
dekopon-provider-sdk-testkit = "=0.18.0"
# sdk-testkit 0.18.0 resolves through dekopon-broker-host 0.18.0, whose published
# lower bound is Tokio 1.49.0. Pin that compatible minimum rather than silently floating it.
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }

[lints.rust]
# `deny`, not `forbid`: wit-bindgen's export glue is `unsafe` by construction and now expands in this
# crate, so `src/lib.rs` allows it on exactly the two generated modules. No handwritten `unsafe`.
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
